header{text-align:center;padding:40px 16px 12px;position:relative;overflow:hidden}
@keyframes flick{0%,100%{filter:drop-shadow(0 0 22px rgba(91,255,26,.55))}45%{filter:drop-shadow(0 0 14px rgba(91,255,26,.3))}50%{filter:drop-shadow(0 0 30px rgba(91,255,26,.8))}}
.logo{margin:0 auto;width:min(250px,62vw);animation:flick 5s infinite}
.logo svg{display:block;width:100%;height:auto;border-radius:22px;overflow:visible}
.sub{font-family:system-ui,sans-serif;color:#2b1200;font-weight:700;text-shadow:0 1px 0 rgba(255,210,140,.55);margin:6px 0 0;font-size:16px}
.status{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:99px;font:600 13px system-ui,sans-serif;background:var(--card);border:1px solid var(--line)}
.status.on{background:var(--acc2);color:#201a14;border-color:var(--acc2)}
main{max-width:1100px;margin:0 auto 32px;padding:18px;background:rgba(18,10,26,.8);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.admin{font-family:system-ui,sans-serif;background:var(--card);border:1px dashed #5bff1a;border-radius:14px;padding:14px;margin-bottom:22px;display:none}
.admin h2{margin:0 0 10px;font-size:15px}
.admin{position:relative;z-index:10}
.admin b{font-size:13px}
input[type=number]{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#deco{position:absolute;left:0;top:0;width:100%;height:0;z-index:5;pointer-events:none}
.d{position:absolute;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.d.ed{pointer-events:auto;cursor:move;outline:1px dashed var(--acc2);touch-action:none}
.d.sel{outline:2px solid var(--acc)}
#scare{position:fixed;inset:0;background:#000;z-index:99;display:none;align-items:center;justify-content:center;cursor:pointer}
#scare.on{display:flex;animation:shake .09s linear infinite}
#scare img,#scare video{width:100%;height:100%;object-fit:contain;animation:zoom .3s ease-out}
@keyframes zoom{from{transform:scale(.2)}to{transform:scale(1.1)}}
@keyframes shake{0%{transform:translate(6px,-4px)}25%{transform:translate(-6px,5px)}50%{transform:translate(5px,6px)}75%{transform:translate(-5px,-6px)}100%{transform:translate(6px,-4px)}}
.admin .r{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
input[type=text]{flex:1;min-width:160px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
input[type=file]{font-size:13px;max-width:100%;color:var(--mute)}
button{font:600 14px system-ui,sans-serif;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;background:var(--ink);color:var(--bg)}
button.p{background:var(--acc);color:#1a0f00}
button.g{background:transparent;color:var(--mute);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
#msg{font-size:13px;color:var(--mute);min-height:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px}
.card{font-family:system-ui,sans-serif}
.tilt{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--line);box-shadow:0 10px 28px rgba(0,0,0,.28);transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease,box-shadow .25s}
.tilt.hot{transition:transform .06s linear;box-shadow:0 22px 44px rgba(0,0,0,.4)}
.tilt img{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;transform:translate(var(--tx,0px),var(--ty,0px));transition:transform .25s ease}
.tilt.hot img{transition:transform .06s linear}
.glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.35),transparent 55%);opacity:0;transition:opacity .25s}
.tilt.hot .glare{opacity:1}
.rank{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);color:#fff;font:700 13px system-ui;padding:3px 9px;border-radius:99px}
.card.mine .tilt{outline:3px solid var(--acc2)}
.card h3{margin:12px 0 4px;font:700 17px Georgia,serif}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.cnt{font-size:13px;color:var(--mute)}
.card .vote{width:100%}
.adm{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.adm label{font:600 12px system-ui;padding:7px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--mute)}
.adm input{display:none}
.adm button{padding:7px 10px;font-size:12px}
.empty,.note{font-family:system-ui,sans-serif;text-align:center;color:var(--mute);padding:30px 10px}
@media (prefers-reduced-motion:reduce){.tilt,.tilt img{transition:none}.logo,#scare.on,#scare img,#scare video{animation:none}}
</style>
</head>
<body>
<div id="deco"></div>
<div id="scare"></div>
<header>

<h1 class="logo"><svg viewBox="0 0 300 300" role="img" aria-label="Juju películas"><defs><radialGradient id="rg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#6a2f9e"/><stop offset="1" stop-color="#2a1040"/></radialGradient></defs><rect width="300" height="300" rx="22" fill="url(#rg)"/><g font-family="Arial Black,Impact,system-ui,sans-serif" font-weight="900" font-size="84" text-anchor="middle"><text x="150" y="150" textLength="228" lengthAdjust="spacingAndGlyphs" stroke="#5bff1a" stroke-width="16" stroke-linejoin="round" fill="#5bff1a">JUJU</text><text x="150" y="150" textLength="228" lengthAdjust="spacingAndGlyphs" stroke="#2a1040" stroke-width="8" stroke-linejoin="round" fill="#2a1040">JUJU</text><text x="150" y="150" textLength="228" lengthAdjust="spacingAndGlyphs" fill="#a8ff5c">JUJU</text></g><text x="150" y="220" text-anchor="middle" textLength="220" font-family="system-ui,sans-serif" font-size="30" fill="#a8ff5c">PELÍCULAS</text></svg></h1>
<p class="sub">Votá qué película vemos esta noche... si te animás 🎃</p>
<span class="status" id="st">Cargando…</span>
</header>
<main>
<section class="admin" id="admin">
<h2>Panel de administración (solo vos lo ves)</h2>
<div class="r"><button id="tog" class="p">…</button><button id="rst" class="g">Reiniciar votos</button></div>
<div class="r"><input type="text" id="t" placeholder="Título de la película" maxlength="80"><input type="file" id="f" accept="image/*"><button id="add">Agregar película</button></div>
<div class="r"><b>Lienzo:</b><input type="file" id="df" accept="image/*"><button id="dadd">Agregar imagen/GIF</button><button id="dedit" class="g">Modo edición: no</button></div>
<div class="r" id="dtools" style="display:none"><b>Seleccionada:</b><button class="g" data-t="-">Más chica</button><button class="g" data-t="+">Más grande</button><button class="g" data-t="rot">Girar</button><button class="g" data-t="top">Al frente</button><button class="g" data-t="del">Eliminar</button></div>
<div class="r"><b>Jumpscare:</b><input type="file" id="sf" accept="image/*,video/mp4,video/webm"><button id="sup">Subir</button><span style="font-size:13px">prob.</span><input type="number" id="sch" min="0" max="100" step="0.5" style="width:72px"><span style="font-size:13px">%</span><button id="son" class="g">…</button><button id="stest" class="g">Probar</button></div>
<div class="r"><b>Fondo:</b><input type="file" id="bf" accept="image/*"><button id="bup">Cambiar fondo</button><button id="bre" class="g">Volver al original</button></div>
<div id="msg"></div>
</section>
<div id="note"></div>
<div class="grid" id="grid"></div>
</main>
<p style="text-align:center;margin:0 0 24px"><a href="#" id="adm" style="color:#2b1200;opacity:.6;font:12px system-ui,sans-serif;text-decoration:none">admin</a></p>
<script>
/* Capa de conexion con Netlify: imita lo que antes hacia Claude (datos, archivos, usuario) */
(()=>{
const pw=()=>{try{return localStorage.getItem('jp_pw')||''}catch(_){return ''}};
let vid='';try{vid=localStorage.getItem('jp_vid')||''}catch(_){}
const rid=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('');
if(!vid){vid=rid();try{localStorage.setItem('jp_vid',vid)}catch(_){}}
const H=(x={})=>({...x,'x-admin':pw()});
let state={},subs=[],owner=false,loaded=false;
const snap=(path,d)=>({id:path.split('/').pop(),exists:!!d,data:()=>d});
function emit(){
  if(!loaded)return;
  for(const s of subs){
    let out,sig;
    if(s.col){
      const docs=Object.keys(state).filter(k=>k.startsWith(s.col+'/')).map(k=>snap(k,state[k]));
      out={docs,size:docs.length,empty:!docs.length};
      sig=JSON.stringify(docs.map(d=>[d.id,d.data()]));
    }else{out=snap(s.path,state[s.path]);sig=JSON.stringify(state[s.path]||null)}
    if(sig!==s.sig){s.sig=sig;s.fn(out)}
  }
}
async function poll(){
  try{const r=await fetch('/api/state',{cache:'no-store'});const j=await r.json();state=j.docs||{};loaded=true;emit()}catch(_){}
}
setInterval(poll,4000);
const call=async(m,path,body)=>{
  const r=await fetch('/api/doc/'+path,{method:m,headers:H({'content-type':'application/json'}),body:body?JSON.stringify(body):undefined});
  if(!r.ok){
    const j=await r.json().catch(()=>({}));const msg=j.error||('Error '+r.status);
    if(!owner)alert(msg);
    throw {code:r.status,message:msg};
  }
  await poll();
};
const ref=path=>({
  set:d=>call('PUT',path,{data:d}),
  update:d=>call('PUT',path,{data:d,merge:true}),
  delete:()=>call('DELETE',path),
  onSnapshot(fn){const s={path,fn,sig:undefined};subs.push(s);poll();return()=>{subs=subs.filter(x=>x!==s)}}
});
const col=name=>({
  onSnapshot(fn){const s={col:name,fn,sig:undefined};subs.push(s);poll();return()=>{subs=subs.filter(x=>x!==s)}},
  doc:id=>ref(name+'/'+(id||rid())),
  add:async d=>{const id=rid();await ref(name+'/'+id).set(d);return ref(name+'/'+id)}
});
const assets={
  upload:async b=>{
    if(b.size>5.5*1024*1024)throw {message:'El archivo pesa mas de 5 MB'};
    const r=await fetch('/api/upload',{method:'POST',headers:H({'content-type':b.type||'application/octet-stream'}),body:b});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw {message:j.error||('Error '+r.status)};
    return j;
  },
  delete:async id=>{await fetch('/api/file/'+id,{method:'DELETE',headers:H()})}
};
const authP=fetch('/api/auth',{headers:H(),cache:'no-store'}).then(r=>r.json()).then(j=>{owner=!!j.ok}).catch(()=>{});
window.claude={use:async n=>{
  await authP;
  if(n==='user')return{isOwner:()=>owner,canEdit:()=>owner,can:()=>true,id:async()=>vid};
  if(n==='db')return{doc:ref,collection:col};
  if(n==='assets')return owner?assets:null;
  return null;
}};
const a=document.getElementById('adm');
authP.then(()=>{a.textContent=owner?'salir del modo admin':'admin'});
a.onclick=async e=>{
  e.preventDefault();
  if(owner){try{localStorage.removeItem('jp_pw')}catch(_){}location.reload();return}
  const p=prompt('Contrase\u00f1a de administrador');if(!p)return;
  try{localStorage.setItem('jp_pw',p)}catch(_){}
  const j=await fetch('/api/auth',{headers:H()}).then(r=>r.json()).catch(()=>({}));
  if(j.ok)location.reload();else{try{localStorage.removeItem('jp_pw')}catch(_){}alert('Contrase\u00f1a incorrecta')}
};
})();
</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null,user=null,assets=null,me=null,owner=false,canVote=false,movies=[],votes=[],isOpen=false,armed=false,ready=false;
const msg=t=>{$('#msg').textContent=t||''};
const errT=e=>(e&&(e.message||e.code))||'error';

async function shrink(f){
  const b=await createImageBitmap(f),w=Math.min(600,b.width),h=Math.round(b.height*w/b.width);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(b,0,0,w,h);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.86));
}

function render(){
  const st=$('#st');
  st.textContent=isOpen?'Votación abierta':'Votación cerrada';
  st.className='status'+(isOpen?' on':'');
  $('#tog').textContent=isOpen?'Cerrar votación':'Abrir votación';
  $('#rst').textContent=armed?'¿Seguro? Tocá de nuevo':'Reiniciar votos';
  const note=$('#note');
  if(!db) note.innerHTML='<div class="note">Iniciá sesión en Claude para ver y votar las películas.</div>';
  else if(!canVote&&!owner) note.innerHTML='<div class="note">Podés ver los resultados, pero tu acceso no permite votar.</div>';
  else note.innerHTML='';
  const cnt={};votes.forEach(v=>cnt[v.movieId]=(cnt[v.movieId]||0)+1);
  const total=movies.reduce((s,m)=>s+(cnt[m.id]||0),0);
  const mine=(votes.find(v=>v.id===me)||{}).movieId;
  const list=[...movies].sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)||(a.at||0)-(b.at||0));
  if(!list.length){$('#grid').innerHTML=ready?'<div class="empty">'+(owner?'Todavía no hay películas. Agregá la primera desde el panel.':'Todavía no hay películas para votar.')+'</div>':'';return}
  $('#grid').innerHTML=list.map((m,i)=>{
    const n=cnt[m.id]||0,pct=total?Math.round(n*100/total):0;
    const can=isOpen&&canVote&&me;
    return `<div class="card${mine===m.id?' mine':''}" data-id="${esc(m.id)}">
<div class="tilt"><img src="/_blob/${esc(m.imageId)}" alt="${esc(m.title)}"><div class="glare"></div><span class="rank">#${i+1}</span></div>
<h3>${esc(m.title)}</h3>
<div class="cnt">${n} ${n===1?'voto':'votos'} · ${pct}%</div>
<div class="bar"><i style="width:${pct}%"></i></div>
<button class="vote ${mine===m.id?'':'p'}" data-act="vote" ${can?'':'disabled'}>${mine===m.id?'✓ Tu voto':(isOpen?'Votar':'Votación cerrada')}</button>
${owner?`<div class="adm"><label>Cambiar portada<input type="file" accept="image/*" data-act="cover"></label><button class="g" data-act="del">Eliminar</button></div>`:''}
</div>`}).join('');
}

// Parallax / tilt on hover
const grid=$('#grid');
grid.addEventListener('mousemove',e=>{
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const t=e.target.closest('.tilt');if(!t)return;
  const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  t.classList.add('hot');
  t.style.setProperty('--ry',((x-.5)*16)+'deg');t.style.setProperty('--rx',((.5-y)*16)+'deg');
  t.style.setProperty('--tx',((.5-x)*18)+'px');t.style.setProperty('--ty',((.5-y)*18)+'px');
  t.style.setProperty('--gx',(x*100)+'%');t.style.setProperty('--gy',(y*100)+'%');
});
grid.addEventListener('mouseout',e=>{
  const t=e.target.closest('.tilt');if(!t||t.contains(e.relatedTarget))return;
  t.classList.remove('hot');['--rx','--ry','--tx','--ty'].forEach(p=>t.style.removeProperty(p));
});

grid.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.closest('.card').dataset.id,act=b.dataset.act;
  try{
    if(act==='vote'&&isOpen&&me) await db.doc('votes/'+me).set({movieId:id,at:Date.now()});
    if(act==='del'&&owner){
      const m=movies.find(x=>x.id===id);
      await db.doc('movies/'+id).delete();
      for(const v of votes.filter(v=>v.movieId===id)) await db.doc('votes/'+v.id).delete();
      if(m&&assets){try{await assets.delete(m.imageId)}catch(_){}}
    }
  }catch(err){msg('Error: '+errT(err))}
});
grid.addEventListener('change',async e=>{
  const inp=e.target.closest('[data-act="cover"]');if(!inp||!inp.files[0])return;
  const id=inp.closest('.card').dataset.id,old=(movies.find(x=>x.id===id)||{}).imageId;
  try{
    msg('Subiendo portada…');
    const a=await assets.upload(await shrink(inp.files[0]));
    await db.doc('movies/'+id).update({imageId:a.id});
    if(old){try{await assets.delete(old)}catch(_){}}
    msg('Portada actualizada');
  }catch(err){msg('Error: '+errT(err))}
});

$('#tog').onclick=async()=>{try{await db.doc('config/main').set({open:!isOpen})}catch(e){msg('Error: '+errT(e))}};
$('#rst').onclick=async()=>{
  if(!armed){armed=true;render();setTimeout(()=>{armed=false;render()},4000);return}
  armed=false;render();
  try{for(const v of votes) await db.doc('votes/'+v.id).delete();msg('Votos reiniciados')}catch(e){msg('Error: '+errT(e))}
};
$('#add').onclick=async()=>{
  const t=$('#t').value.trim(),f=$('#f').files[0];
  if(!t||!f){msg('Falta el título o la imagen');return}
  if(!assets){msg('No se pueden subir imágenes en esta vista');return}
  try{
    msg('Subiendo…');
    const a=await assets.upload(await shrink(f));
    await db.collection('movies').add({title:t,imageId:a.id,at:Date.now()});
    $('#t').value='';$('#f').value='';msg('Película agregada');
  }catch(e){msg('Error: '+errT(e))}
};

let decor=[],sel=null,edit=false,drag=null,scareCfg={},rolled=false;
const rawUp=async f=>{if(!assets)throw {message:'No se pueden subir archivos en esta vista'};return assets.upload(f)};
function showTools(){const m=decor.find(d=>d.id===sel);$('#dtools').style.display=edit&&m?'flex':'none'}
function renderDeco(){
  if(drag)return;
  $('#deco').innerHTML=decor.map(m=>`<img class="d${edit&&owner?' ed':''}${sel===m.id&&edit?' sel':''}" data-id="${esc(m.id)}" src="/_blob/${esc(m.imageId)}" alt="" draggable="false" style="left:${+m.x||0}%;top:${+m.y||0}px;width:${+m.w||20}%;transform:rotate(${+m.rot||0}deg);z-index:${+m.z||1}">`).join('');
  showTools();
}
$('#deco').addEventListener('pointerdown',e=>{
  const t=e.target.closest('.d.ed');if(!t)return;e.preventDefault();
  sel=t.dataset.id;const r=t.getBoundingClientRect();
  drag={t,dx:e.clientX-r.left,dy:e.clientY-r.top};t.setPointerCapture(e.pointerId);
  document.querySelectorAll('.d').forEach(n=>n.classList.toggle('sel',n===t));showTools();
});
$('#deco').addEventListener('pointermove',e=>{
  if(!drag)return;
  const W=document.documentElement.clientWidth;
  drag.x=(e.pageX-drag.dx)/W*100;drag.y=e.pageY-drag.dy;
  drag.t.style.left=drag.x+'%';drag.t.style.top=drag.y+'px';
});
$('#deco').addEventListener('pointerup',async()=>{
  if(!drag)return;const d=drag;drag=null;
  if(d.x!=null){try{await db.doc('decor/'+d.t.dataset.id).update({x:d.x,y:d.y})}catch(e){msg('Error: '+errT(e))}}
});
$('#dtools').addEventListener('click',async e=>{
  const b=e.target.closest('[data-t]'),m=decor.find(d=>d.id===sel);if(!b||!m)return;
  const t=b.dataset.t,ref=db.doc('decor/'+sel);
  try{
    if(t==='+')await ref.update({w:Math.min(90,(+m.w||20)+4)});
    if(t==='-')await ref.update({w:Math.max(3,(+m.w||20)-4)});
    if(t==='rot')await ref.update({rot:((+m.rot||0)+15)%360});
    if(t==='top')await ref.update({z:Math.max(1,...decor.map(d=>+d.z||1))+1});
    if(t==='del'){await ref.delete();if(assets){try{await assets.delete(m.imageId)}catch(_){}}sel=null}
  }catch(err){msg('Error: '+errT(err))}
});
$('#dadd').onclick=async()=>{
  const f=$('#df').files[0];if(!f){msg('Elegí una imagen o GIF');return}
  try{msg('Subiendo…');const a=await rawUp(f);await db.collection('decor').add({imageId:a.id,x:35,y:140,w:20,rot:0,z:1,at:Date.now()});$('#df').value='';msg('Agregada. Activá el modo edición para moverla.')}catch(e){msg('Error: '+errT(e))}
};
$('#dedit').onclick=()=>{edit=!edit;$('#dedit').textContent='Modo edición: '+(edit?'sí':'no');renderDeco()};

// Jumpscare
const saveScare=p=>db.doc('config/scare').set({...scareCfg,...p});
function syncScare(){
  $('#son').textContent=scareCfg.on?'Jumpscare: activado':'Jumpscare: apagado';
  const i=$('#sch');if(document.activeElement!==i)i.value=scareCfg.chance??5;
}
function sting(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),g=a.createGain(),o=a.createOscillator(),t=a.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(70,t+1.2);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+1.4);o.connect(g);g.connect(a.destination);o.start();o.stop(t+1.5)}catch(_){}}
function scare(c){
  const o=$('#scare');
  o.innerHTML=c.kind==='video'?`<video src="/_blob/${esc(c.imageId)}" autoplay playsinline></video>`:`<img src="/_blob/${esc(c.imageId)}" alt="">`;
  o.className='on';
  const close=()=>{o.className='';o.innerHTML=''};
  o.onclick=close;
  const v=o.querySelector('video');
  if(v){v.onended=close;v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})})}
  else{sting();setTimeout(close,2600)}
}
function maybeScare(){
  if(owner)return;const c=scareCfg;
  if(c&&c.on&&c.imageId&&Math.random()*100<(+c.chance||0))setTimeout(()=>scare(c),4000+Math.random()*16000);
}
$('#sup').onclick=async()=>{
  const f=$('#sf').files[0];if(!f){msg('Elegí la imagen, GIF o video');return}
  try{msg('Subiendo…');const a=await rawUp(f);await saveScare({imageId:a.id,kind:f.type.startsWith('video')?'video':'img'});$('#sf').value='';msg('Jumpscare guardado')}catch(e){msg('Error: '+errT(e))}
};
$('#son').onclick=()=>saveScare({on:!scareCfg.on}).catch(e=>msg('Error: '+errT(e)));
$('#sch').onchange=()=>{const v=Math.max(0,Math.min(100,parseFloat($('#sch').value)||0));saveScare({chance:v}).catch(e=>msg('Error: '+errT(e)))};
$('#stest').onclick=()=>{scareCfg.imageId?scare(scareCfg):msg('Primero subí el jumpscare')};

$('#bup').onclick=async()=>{
  const f=$('#bf').files[0];if(!f){msg('Elegí la imagen del fondo');return}
  try{msg('Subiendo fondo…');const a=await rawUp(f);await db.doc('config/bg').set({imageId:a.id});$('#bf').value='';msg('Fondo cambiado')}catch(e){msg('Error: '+errT(e))}
};
$('#bre').onclick=async()=>{try{await db.doc('config/bg').delete();msg('Fondo original restaurado')}catch(e){msg('Error: '+errT(e))}};

(async()=>{
  render();
  try{user=await claude.use('user')}catch(_){}
  owner=user?user.isOwner():false;
  if(owner)$('#admin').style.display='block';
  try{me=user?await user.id():null}catch(_){}
  try{db=await claude.use('db')}catch(_){}
  if(owner){try{assets=await claude.use('assets')}catch(_){}}
  if(!db){ready=true;render();return}
  try{canVote=user?(await user.can('data.write'))!==false:true}catch(_){canVote=true}
  const bad=e=>{msg('Error de datos: '+errT(e))};
  db.collection('movies').onSnapshot(s=>{movies=s.docs.map(d=>({id:d.id,...d.data()}));ready=true;render()},bad);
  db.collection('votes').onSnapshot(s=>{votes=s.docs.map(d=>({id:d.id,movieId:(d.data()||{}).movieId}));render()},bad);
  db.doc('config/main').onSnapshot(s=>{isOpen=!!(s.exists&&s.data().open);render()},bad);
  db.collection('decor').onSnapshot(s=>{decor=s.docs.map(d=>({id:d.id,...d.data()}));renderDeco()},bad);
  db.doc('config/bg').onSnapshot(s=>{const d=s.exists?s.data():null;document.body.style.backgroundImage=d&&d.imageId?`url(/_blob/${d.imageId})`:''},bad);
  db.doc('config/scare').onSnapshot(s=>{scareCfg=s.exists?s.data():{};syncScare();if(!rolled){rolled=true;maybeScare()}},bad);
})();
</script>
</body>
</html>
